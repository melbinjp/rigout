name: Verify Wheel

# Proves that a built wheel actually installs and works, on every supported
# operating system, from a clean environment with no source checkout on the path.
#
# This lived inside scheduled-ci.yml until it was pulled out here, because it had
# exactly one caller and the wrong one. The weekly run asks "did the world break
# rigout since our last commit?" - a real question, and the reason the job was
# written. Nobody was asking "is the wheel we are about to publish installable?",
# and that is the question where a wrong answer cannot be taken back: PyPI does
# not allow a version to be re-uploaded. A broken 0.3.2 is fixed only by shipping
# 0.3.3, after every user who installed in between has already hit it.
#
# The bug class this catches is invisible to everything else in the pipeline.
# `pip install -e .` imports out of src/, so it cannot notice a module missing
# from the wheel, a mis-declared package, dropped package data, or a console
# script pointing at a function that does not exist. `twine check` reads metadata
# and never installs anything. Both pass on a wheel that is broken for every user.

on:
  workflow_call:
    inputs:
      artifact:
        description: >
          Name of an artifact in this run holding the wheel to verify. Leave empty
          to build the wheel from the checkout instead. The release pipeline passes
          one so that what gets tested is the exact file that will be published,
          rather than a rebuild that could differ from it.
        type: string
        required: false
        default: ""

# Deliberately no `permissions:` block, so this inherits whatever the caller grants.
#
# The two paths genuinely need different things: the artifact path reads the run's
# artifacts through the Actions API and so needs `actions: read`, and the checkout path
# needs nothing beyond `contents: read`. Declaring the union here would break the
# scheduled caller outright - scheduled-ci.yml caps its run at `contents: read`, and a
# called workflow may not request more than its caller grants, so the weekly run would
# fail at startup. Every Monday, in the workflow whose whole job is noticing silent
# breakage. Each caller grants what its own path needs instead.

jobs:
  verify:
    name: Fresh Install (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        # Oldest and newest supported: the two ends where resolution breaks first.
        python-version: ["3.10", "3.14"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build The Wheel From The Checkout
        if: inputs.artifact == ''
        shell: bash
        run: |
          set -euo pipefail
          # A stale dist/ from an earlier build would be installed silently, so the
          # run would test a wheel that is not the one this commit produces.
          rm -rf dist
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Download The Wheel That Will Be Published
        if: inputs.artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: dist

      - name: Check Exactly One Wheel, Matching pyproject
        shell: bash
        run: |
          set -euo pipefail
          # tomli is the pre-3.11 half of the tomllib fallback below. pyproject declares
          # requires-python = ">=3.10" and this matrix tests 3.10, but tomllib only entered
          # the stdlib in 3.11 - so the version check below could never run on the oldest
          # Python the package claims to support.
          #
          # Installed HERE rather than in the build step above, because the build step is
          # skipped on the artifact path and this one is not. Leaving it there would have
          # made every release-time run fail on 3.10 with a ModuleNotFoundError, which is a
          # fresh instance of the same bug that fix was for.
          python -m pip install --upgrade pip 'tomli; python_version < "3.11"'
          expected="$(python -c "
          try:
              import tomllib
          except ModuleNotFoundError:  # Python 3.10
              import tomli as tomllib
          print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "EXPECTED_VERSION=$expected" >> "$GITHUB_ENV"
          count="$(ls dist/*.whl | wc -l)"
          if [ "$count" -ne 1 ]; then
            echo "expected exactly one wheel in dist/, found $count:" >&2
            ls -l dist >&2
            exit 1
          fi
          wheel="$(ls dist/*.whl)"
          case "$(basename "$wheel")" in
            rigout-"$expected"-*) echo "verifying $wheel (version $expected)" ;;
            *) echo "wheel $wheel does not match pyproject version $expected" >&2; exit 1 ;;
          esac

      - name: Install The Wheel Into A Clean Environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv fresh-env
          # Absolute, so later steps can cd elsewhere and still invoke these.
          if [ -d fresh-env/Scripts ]; then
            venv_bin="$(pwd)/fresh-env/Scripts"
          else
            venv_bin="$(pwd)/fresh-env/bin"
          fi
          echo "VENV_BIN=$venv_bin" >> "$GITHUB_ENV"
          echo "VENV_PYTHON=$venv_bin/python" >> "$GITHUB_ENV"
          "$venv_bin/python" -m pip install --upgrade pip
          # No --no-deps and no dev extra: this must resolve runtime deps from
          # PyPI exactly as `pip install rigout` will for a user.
          "$venv_bin/python" -m pip install dist/*.whl
          installed="$("$venv_bin/python" -c "import importlib.metadata as m;print(m.version('rigout'))")"
          if [ "$installed" != "$EXPECTED_VERSION" ]; then
            echo "installed rigout $installed but pyproject declares $EXPECTED_VERSION" >&2
            exit 1
          fi
          echo "installed rigout $installed"

      - name: Show Resolved Dependency Versions
        shell: bash
        run: |
          "$VENV_PYTHON" -m pip freeze

      - name: Import Every Shipped Module
        shell: bash
        run: |
          set -euo pipefail
          # Run from a directory with no src/ on the path, so this genuinely
          # exercises the installed package rather than the checkout.
          cd "$RUNNER_TEMP"
          # The package is walked rather than listed. A hardcoded list rots in
          # both directions: it misses every module added later, and it breaks
          # the run when one is removed.
          "$VENV_PYTHON" - <<'PY'
          import importlib
          import pkgutil
          import sys

          import rigout

          failed = []
          found = 0
          for module in pkgutil.walk_packages(rigout.__path__, "rigout."):
              found += 1
              try:
                  importlib.import_module(module.name)
              except Exception as exc:  # noqa: BLE001 - any failure is a failure
                  failed.append((module.name, exc))

          print(f"rigout {rigout.__version__}: walked {found} modules")
          for name, exc in failed:
              print(f"FAILED {name}: {type(exc).__name__}: {exc}", file=sys.stderr)
          if failed:
              sys.exit(1)
          if not found:
              print("walked zero modules - the package looks empty", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Run The Console Scripts
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"

          # Checks the entry points a user actually gets, not `python -m rigout...`.
          # Module execution succeeds even if [project.scripts] is misspelled, points
          # at a function that does not exist, or is dropped entirely.
          #
          # The names are read from the INSTALLED distribution metadata, so this
          # cannot rot as scripts are added or removed, and `ep.load()` resolves the
          # module and the attribute without calling them.
          #
          # Deliberately NOT `--help` on every script: rigout-stdio maps to
          # server.py:stdio_main, which has no argument parser. It would ignore
          # --help, start a real stdio MCP server and block until the job timed out.
          "$VENV_PYTHON" - <<'PY'
          import importlib.metadata as metadata
          import sys

          entry_points = [
              ep
              for ep in metadata.distribution("rigout").entry_points
              if ep.group == "console_scripts"
          ]
          if not entry_points:
              print("the installed rigout exposes no console_scripts", file=sys.stderr)
              sys.exit(1)

          failed = []
          for ep in entry_points:
              try:
                  target = ep.load()
              except Exception as exc:  # noqa: BLE001 - any failure is a failure
                  failed.append(f"{ep.name} = {ep.value} -> {type(exc).__name__}: {exc}")
                  continue
              if not callable(target):
                  failed.append(f"{ep.name} = {ep.value} -> resolved to a non-callable {target!r}")
                  continue
              print(f"entry point OK: {ep.name} = {ep.value}")

          for line in failed:
              print(f"BROKEN entry point: {line}", file=sys.stderr)
          sys.exit(1 if failed else 0)
          PY

          # And prove pip actually put an executable on disk for each of them.
          scripts="$("$VENV_PYTHON" -c "
          import importlib.metadata as m
          print(' '.join(e.name for e in m.distribution('rigout').entry_points if e.group == 'console_scripts'))
          ")"
          for script in $scripts; do
            if [ -x "$VENV_BIN/$script" ]; then
              executable="$VENV_BIN/$script"
            elif [ -x "$VENV_BIN/$script.exe" ]; then
              executable="$VENV_BIN/$script.exe"   # Windows
            else
              echo "console script '$script' was not installed into $VENV_BIN" >&2
              ls -l "$VENV_BIN" >&2
              exit 1
            fi
            echo "installed executable OK: $executable"
          done

          # rigout is the one script with a real parser, so it gets genuinely run.
          # stdin is closed and the call is bounded so this can never hang the job.
          if [ -x "$VENV_BIN/rigout" ] || [ -x "$VENV_BIN/rigout.exe" ]; then
            "$VENV_BIN/rigout" --help < /dev/null > /dev/null
            echo "executed: rigout --help"
          fi
