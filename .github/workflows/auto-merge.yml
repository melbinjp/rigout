name: Enable Auto-Merge

# Arms GitHub auto-merge on pull requests to main from people with write access. GitHub merges
# once the required checks pass and the pull request has an approval (CodeRabbit's counts).
# Anyone else's pull request is merged by hand.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  enable-auto-merge:
    name: Enable Auto-Merge for Owner PRs
    runs-on: ubuntu-latest
    if: >-
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
               github.event.pull_request.author_association) &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false
    # contents: write is needed to arm auto-merge; pull-requests: write alone is refused.
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        # Retried so a brief GitHub outage does not leave a red check on a good pull request.
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            gh pr merge "$PR" --auto --squash --repo "$REPO" && exit 0
            echo "gh pr merge failed (attempt $attempt/5); retrying" >&2
            sleep $((attempt * 10))
          done
          echo "could not arm auto-merge after 5 attempts" >&2
          exit 1
