name: Docs match the code

# docproof checks that paths, CLI flags and names the documentation mentions still exist.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docproof:
    name: Documented claims still hold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history lets docproof tell a removed file from one that never existed.
          fetch-depth: 0
          # docproof is a third-party action, so the token is not left in the git config for it.
          persist-credentials: false

      # Pinned to a commit, since a tag can be moved.
      - uses: melbinjp/docproof@5798f6ac3c0b0aec739c4da135cc6b6c45c96fe5  # v0.2.4
        with:
          show-skips: 'true'
