name: Scheduled CI

# A dependency released after the last commit can break `pip install rigout` with no push to
# trigger CI. This runs the full CI and a clean wheel install every week, and keeps one issue
# open while it fails.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC; off the hour, where GitHub drops fewer runs.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-ci
  cancel-in-progress: false

jobs:
  full-ci:
    name: Full CI
    uses: ./.github/workflows/ci.yml

  # Report only: a new major version of a capped dependency is news, not a failure.
  held-back-majors:
    name: Report Dependencies Held Back By Caps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compare Caps Against Latest On PyPI
        continue-on-error: true
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, tomllib, urllib.request
          from urllib.error import URLError

          with open("pyproject.toml", "rb") as handle:
              deps = tomllib.load(handle)["project"]["dependencies"]

          print("## Dependencies held back by a version cap\n")
          print("| package | latest on PyPI | cap | status |")
          print("| --- | --- | --- | --- |")
          for spec in deps:
              name = spec.split(">")[0].split("<")[0].split("=")[0].strip()
              cap = spec.split("<")[1].strip() if "<" in spec else None
              try:
                  with urllib.request.urlopen(f"https://pypi.org/pypi/{name}/json", timeout=30) as response:
                      latest = json.load(response)["info"]["version"]
              except (URLError, KeyError, ValueError) as exc:
                  print(f"| {name} | ? | {cap or '-'} | lookup failed: {exc} |")
                  continue
              if cap and int(latest.split(".")[0]) >= int(cap.split(".")[0]):
                  print(f"| {name} | {latest} | <{cap} | **held back: test and raise the cap** |")
              else:
                  print(f"| {name} | {latest} | {'<' + cap if cap else 'uncapped'} | ok |")
          PY

  # CI installs the checkout in editable mode; this installs the built wheel alone, as a user would.
  fresh-install:
    name: Fresh Wheel Install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build The Wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install The Wheel Alone And Use It
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          /tmp/wheel-env/bin/pip freeze
          cd /tmp && /tmp/wheel-env/bin/python "$GITHUB_WORKSPACE/production_validation.py"

  report-failure:
    name: Report Failure
    needs: [full-ci, fresh-install]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open Or Update The Failure Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create scheduled-ci-failure --repo "$REPO" --color B60205 \
            --description "A scheduled CI run failed without any code change" 2>/dev/null || true

          body="The scheduled CI run failed with no code change, so a newly released dependency is the likely cause.

          Failed run: $RUN_URL

          Compare the versions printed by \`pip freeze\` in Fresh Wheel Install with the bounds in \`pyproject.toml\`. This issue is commented on, not duplicated, while runs keep failing, and closes when one passes."

          # The open issue is looked up again on every attempt, so a create whose response was
          # lost is found and commented on instead of filed twice.
          for attempt in 1 2 3 4 5; do
            if existing="$(gh issue list --repo "$REPO" --label scheduled-ci-failure --state open \
                 --json number --jq '.[0].number // empty')"; then
              if [ -n "$existing" ]; then
                gh issue comment "$existing" --repo "$REPO" --body "$body" && exit 0
              else
                gh issue create --repo "$REPO" --title "Scheduled CI is failing" \
                  --label scheduled-ci-failure --body "$body" && exit 0
              fi
            fi
            sleep $((attempt * 10))
          done
          echo "could not report the failure after 5 attempts" >&2
          exit 1

  clear-failure:
    name: Clear Failure Report
    needs: [full-ci, fresh-install]
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close Any Open Failure Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if existing="$(gh issue list --repo "$REPO" --label scheduled-ci-failure --state open \
                 --json number --jq '.[0].number // empty')"; then
              [ -z "$existing" ] && { echo "No open failure issue."; exit 0; }
              gh issue close "$existing" --repo "$REPO" --comment "A scheduled CI run passed again: $RUN_URL" && exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "could not close the failure issue after 5 attempts" >&2
          exit 1
