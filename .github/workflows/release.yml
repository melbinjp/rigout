name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # Runs before anything is built, because every failure it catches produces an
  # artifact that looks correct: a tag naming a version the package does not carry, a
  # release with no changelog entry, a breaking change shipped as a patch bump, or a
  # tag placed on a commit that never reached main. None of those fail a build.
  check-release:
    name: Check Version, Tag and Changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # Tags and main are both needed: one to compare this version against the
          # last released one, the other to prove the tagged commit is on main.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check version, tag and changelog agree
        run: python scripts/check_release.py --tag "${GITHUB_REF_NAME}"

      - name: Check the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at a commit that is not on main." >&2
            echo "Publishing it would ship code that no merged branch contains." >&2
            exit 1
          fi
          echo "Tagged commit is on main."

  ci:
    name: Run CI Pipeline
    needs: check-release
    uses: ./.github/workflows/ci.yml

  build-release:
    name: Build Release Artifacts
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build Package
        run: python -m build

      - name: Check Package Build
        run: python -m twine check dist/*

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  # The last chance to find out that the wheel does not work, and the only one that
  # matters: PyPI does not allow a version to be re-uploaded, so a broken 0.3.2 can
  # only be answered by shipping 0.3.3 to users who have already installed it.
  #
  # Nothing above this catches that. `ci` installs `-e ".[dev]"`, which imports out of
  # src/ and therefore cannot see a module missing from the wheel, a mis-declared
  # package, dropped package data, or a console script pointing at a function that does
  # not exist. `twine check` reads metadata and never installs anything. Both are green
  # on a wheel that fails for every user.
  #
  # The artifact name is passed so this installs the exact file publish-pypi uploads,
  # rather than a rebuild that could differ from it.
  verify-wheel:
    name: Verify The Built Wheel
    needs: build-release
    uses: ./.github/workflows/verify-wheel.yml
    with:
      artifact: release-dist

  publish-pypi:
    name: Publish to PyPI
    needs: [build-release, verify-wheel]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rigout
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist/

      - name: Publish Package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
