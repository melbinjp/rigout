version: 2
updates:
  # One pull request a month per ecosystem. Version ranges in pyproject.toml are only raised when a
  # new release falls outside them, so a release inside an allowed range opens nothing. New majors
  # held back by a cap are reported by the scheduled CI run instead.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 1
    groups:
      pip:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
